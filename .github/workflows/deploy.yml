
name: Deploy Spring Boot to Ubuntu

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true)

    runs-on: self-hosted

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Application
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      - name: Prepare Deployment Directory
        run: |
          mkdir -p "$HOME/spring-demo"

      - name: Stop Old Application
        run: |
          APP_DIR="$HOME/spring-demo"
          PID_FILE="$APP_DIR/app.pid"

          if [ -f "$PID_FILE" ]; then
            PID=$(cat "$PID_FILE")

            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID"
              for i in $(seq 1 10); do
                kill -0 "$PID" 2>/dev/null || break
                sleep 1
              done

              if kill -0 "$PID" 2>/dev/null; then
                echo "Old application did not stop"
                exit 1
              fi
            fi

            rm -f "$PID_FILE"
          fi

      - name: Copy New Application
        run: |
          APP_DIR="$HOME/spring-demo"
          JAR_FILE=$(find target -maxdepth 1 -type f \
            -name '*.jar' ! -name '*.original' -print -quit)

          if [ -z "$JAR_FILE" ]; then
            echo "No executable JAR found in target/"
            exit 1
          fi

          cp "$JAR_FILE" "$APP_DIR/app.jar"

      - name: Start Application
        run: |
          cd "$HOME/spring-demo"
          nohup java -jar app.jar --server.port=8081 > app.log 2>&1 &
          echo $! > app.pid

      - name: Verify Deployment
        run: |
          for i in $(seq 1 15); do
            if curl --fail --silent \
              http://localhost:8081/hello; then
              echo "Deployment successful"
              exit 0
            fi
            sleep 2
          done

          echo "Application did not respond successfully"
          cat "$HOME/spring-demo/app.log"
          exit 1


