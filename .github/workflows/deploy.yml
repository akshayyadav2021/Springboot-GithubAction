
name: Deploy Spring Boot to Ubuntu

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
      - name: Checkout Main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Application
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      - name: Prepare Deployment Directory
        run: |
          mkdir -p /home/akshay/spring-demo

      - name: Copy New Application
        run: |
          set -e
          JAR_FILE=$(find target -maxdepth 1 -type f \
            -name '*.jar' ! -name '*.original' -print -quit)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No executable JAR found"
            exit 1
          fi

          install -m 0644 "$JAR_FILE" /home/akshay/spring-demo/app.jar

      - name: Restart Spring Boot Service
        run: |
          set -e
          sudo -n /usr/bin/systemctl restart spring-demo
          sudo -n /usr/bin/systemctl is-active spring-demo

      - name: Verify Deployment
        run: |
          for i in $(seq 1 150); do
            if curl --fail --silent \
              --connect-timeout 1 --max-time 3 \
              http://localhost:8081/hello; then
              echo
              echo "SUCCESS: Spring Boot deployment verified"
              exit 0
            fi

            echo "Waiting for Spring Boot startup: $i/150"
            sleep 4
          done

          echo "ERROR: Spring Boot did not become ready"
          sudo -n /usr/bin/systemctl is-active spring-demo || true
          exit 1
